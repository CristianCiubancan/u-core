services:
  fivem:
    build:
      context: ./
      args:
        BINARIES_ARCHIVE_URL: ${BINARIES_ARCHIVE_URL}
    env_file: .env
    ports:
      - '30120:30120/tcp'
      - '30120:30120/udp'
      - '40120:40120/tcp'
      # Reload endpoint is a developer feature; bind to localhost only.
      - '127.0.0.1:3414:3414'
    volumes:
      - ./txData:/root/binaries/txData
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      - db

  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    # No host port publish: fivem service reaches the DB on the internal
    # compose network at host `db:3306`. Add a localhost-bound publish here
    # only when you need an external client (and prefer SSH tunneling).

volumes:
  db_data:
