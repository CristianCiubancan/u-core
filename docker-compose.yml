services:
  fivem:
    build:
      context: ./
      args:
        BINARIES_ARCHIVE_URL: ${BINARIES_ARCHIVE_URL}
    env_file: .env
    ports:
      - '30120:30120/tcp'
      - '30120:30120/udp'
      - '40120:40120/tcp'
      # Reload endpoint is a developer feature; bind to localhost only.
      - '127.0.0.1:3414:3414'
    volumes:
      - ./txData:/home/fivem/binaries/txData
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Wait until MariaDB reports healthy before starting FXServer; otherwise
    # the txAdmin first-run wizard / migrations race with mariadb-init.
    depends_on:
      db:
        condition: service_healthy
    # Cap container log volume so long-running FXServer instances don't
    # silently fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    # No host port publish: fivem service reaches the DB on the internal
    # compose network at host `db:3306`. Add a localhost-bound publish here
    # only when you need an external client (and prefer SSH tunneling).
    # `mariadb-admin ping` (mariadb's rename of mysqladmin) — use --silent so
    # the ping output never floods container logs.
    healthcheck:
      test:
        [
          'CMD',
          'mariadb-admin',
          'ping',
          '--silent',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  db_data:
